# Qorgau DLP v2.0 — Automated Debian 12 Appliance Preseed
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network (DHCP by default; works offline without mirror)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string qorgau-dlp
d-i netcfg/get_domain string local
d-i netcfg/dhcp_timeout string 10
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_options select Do not configure the network at this time

# Offline install: do not require network mirror
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false

# Clock & timezone (Kazakhstan UTC+5)
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Almaty
d-i clock-setup/ntp boolean false

# Partitioning (entire primary disk, single ext4 + swap)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Users (root locked; local sysadmin qorgau / qorgau2026 — change on first login!)
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Qorgau Appliance Admin
d-i passwd/username string qorgau
d-i passwd/user-password password qorgau2026
d-i passwd/user-password-again password qorgau2026
d-i user-setup/allow-password-weak boolean true

# Minimal base + SSH server only
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Copy Qorgau DLP payload from ISO and execute offline appliance setup inside target
d-i preseed/late_command string \
    mkdir -p /target/opt/qorgau; \
    cp -a /cdrom/qorgau/* /target/opt/qorgau/; \
    chmod +x /target/opt/qorgau/post-install.sh; \
    in-target /opt/qorgau/post-install.sh

d-i finish-install/reboot_in_progress note
