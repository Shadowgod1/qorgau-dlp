services:
  db:
    image: postgres:16-alpine
    container_name: qorgau_db
    restart: always
    environment:
      POSTGRES_DB: qorgau_dlp
      POSTGRES_USER: qorgau_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qorgau_user -d qorgau_dlp"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qorgau_server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      BIND_ADDR: "0.0.0.0:8000"
      DATABASE_URL: "postgres://qorgau_user:${DB_PASSWORD}@db:5432/qorgau_dlp"
      SCREENSHOTS_DIR: "/app/screenshots"
      SHADOW_DIR: "/app/shadow"
      AUDIO_DIR: "/app/audio"
      WEBCAM_DIR: "/app/webcam_photos"
    volumes:
      - screenshots:/app/screenshots
      - shadow:/app/shadow
      - audio:/app/audio
      - webcam_photos:/app/webcam_photos
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: qorgau_nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  screenshots:
  shadow:
  audio:
  webcam_photos:
