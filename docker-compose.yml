services:
  db:
    image: postgres:16-alpine
    container_name: qorgau_db
    restart: always
    environment:
      POSTGRES_DB: qorgau_dlp
      POSTGRES_USER: qorgau_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: qorgau_redis
    restart: always
    volumes:
      - redisdata:/data

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: qorgau_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - ./server:/app
      - logs:/app/logs
      - screenshots:/app/screenshots
      - shadow:/app/shadow
      - audio:/app/audio
      - webcam_photos:/app/webcam_photos

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: qorgau_worker
    restart: always
    command: celery -A app.workers.tasks worker --loglevel=info --concurrency=4
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - ./server:/app
      - logs:/app/logs
      - screenshots:/app/screenshots
      - shadow:/app/shadow
      - audio:/app/audio
      - webcam_photos:/app/webcam_photos

  beat:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: qorgau_beat
    restart: always
    command: celery -A app.workers.tasks beat --loglevel=info
    depends_on:
      - redis
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    container_name: qorgau_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: qorgau_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  pgdata:
  redisdata:
  grafana_data:
  logs:
  screenshots:
  shadow:
  audio:
  webcam_photos:
